name: CI

on:
  # start a run by hand from the Actions tab, or with
  # `gh workflow run ci.yml --ref <branch>`, on any branch.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typechecks the host and the webview separately: each runs against the
      # libraries it actually has, so DOM code cannot leak into the extension
      # host and the VS Code API cannot leak into the webview.
      - name: Typecheck
        run: npm run check

      - name: Format
        run: npm run format:check

      # Includes the contract tests, which read the shell scripts in this
      # repository and fail when a catalog entry or a message the extension
      # matches on drifts away from what the scripts actually do.
      - name: Test
        run: npm test

      # Proves the bundle and the .vsix still build, and leaves the package
      # attached to the run so a reviewer can install the exact artifact.
      - name: Package
        run: npx --yes @vscode/vsce@latest package --no-dependencies -o nova-expo.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: nova-expo-vsix
          path: nova-expo.vsix
